<rect x="260" y="310" width="476" height="36" rx="3" fill="#E6B15C"/>
<text x="726" y="334" font-size="17" fill="#101418" font-weight="700" text-anchor="end" data-box="260,310,476,36">309 short</text>
<text x="24" y="380" font-size="15" fill="#A9AEB5">Each scenario requests 309 units.</text>
